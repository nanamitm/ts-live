name: Wasm

on:
  push:
    branches: [main]
    paths:
      - 'wasm/**'
      - 'scripts/test-ttml.sh'
      - 'test/wasm/ttml*'
      - 'src/lib/ttml.ts'
      - '.github/workflows/build-wasm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wasm/**'
      - 'scripts/test-ttml.sh'
      - 'test/wasm/ttml*'
      - 'src/lib/ttml.ts'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run clang-format style check for C/C++/Protobuf programs.
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: '10'
          check-path: ./wasm

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: 'emsdk-cache'

      - name: cmake config
        run: yarn cmake:config
      - name: build
        run: yarn cmake:build

      # The ARIB-TTML parser built into the wasm (dantto4k), run in Node
      # together with the layout in src/lib/ttml.ts. The test imports the
      # TypeScript directly, which needs Node 22.6 or later.
      - name: Setup Node for the TTML test
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: TTML test
        run: bash scripts/test-ttml.sh

      - name: upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-wasm
          path: public/wasm
