name: Release to release branch

on:
  release:
    types: [published]

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 公開されたリリースの内容で release ブランチを置き換える。
      # checkout が origin に認証情報を設定するので、そのまま push できる。
      - name: Force the release branch to the published release
        run: git push --force origin HEAD:release
